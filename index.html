<script>
    // 打开弹窗
    function openVipModal() {
        document.getElementById('vipModal').classList.add('active');
        document.getElementById('vipPassword').value = '';
        document.getElementById('errorMsg').textContent = '';
        setTimeout(() => {
            document.getElementById('vipPassword').focus();
        }, 100);
    }

    // 关闭弹窗
    function closeVipModal() {
        document.getElementById('vipModal').classList.remove('active');
        document.getElementById('errorMsg').textContent = '';
    }

    // 验证密码
    function verifyPassword() {
        var input = document.getElementById('vipPassword').value;
        var errorEl = document.getElementById('errorMsg');
        if (input === 'amwlxq') {
            window.location.href = 'vipindex.html';
        } else {
            errorEl.textContent = '❌ 密码错误，请重试';
            document.getElementById('vipPassword').value = '';
            document.getElementById('vipPassword').focus();
        }
    }

    // 回车触发确认
    document.getElementById('vipPassword').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            verifyPassword();
        }
    });

    // 点击遮罩关闭
    document.getElementById('vipModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeVipModal();
