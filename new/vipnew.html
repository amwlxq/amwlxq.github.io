<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>更新公告 · 傲慢无礼象群 VIP</title>
  <!-- Font Awesome 图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #0b0f1a, #030508);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      padding: 2rem 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* 动态粒子背景 */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 50%;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.8);
        opacity: 0.3;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* 主卡片 — 毛玻璃 */
    .glass-card {
      position: relative;
      z-index: 10;
      max-width: 800px;
      width: 100%;
      background: rgba(10, 14, 23, 0.65);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border-radius: 3rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    /* 头部 */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 1.5rem;
    }

    .brand h1 {
      font-size: 2rem;
      font-weight: 600;
      background: linear-gradient(135deg, #f0f9ff 0%, #b6d4fe 80%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 i {
      font-size: 1.8rem;
      color: #ff7b9c;
      filter: drop-shadow(0 0 8px rgba(255, 123, 156, 0.3));
    }

    .brand .sub {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand .sub i {
      color: #ff7b9c;
    }

    .back-link {
      color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.04);
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      font-size: 0.85rem;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    /* 公告列表 */
    .announcement-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin: 1.5rem 0 0.5rem;
    }

    .announcement-item {
      background: rgba(20, 30, 50, 0.2);
      backdrop-filter: blur(4px);
      border-radius: 1.2rem;
      padding: 0.9rem 1.8rem;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .announcement-item:hover {
      background: rgba(30, 50, 80, 0.4);
      border-color: rgba(255, 123, 156, 0.2);
      transform: translateX(6px);
      box-shadow: 0 8px 24px -6px rgba(255, 123, 156, 0.08);
    }

    .announcement-item .left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .announcement-item .icon-circle-small {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: #ff7b9c;
      border: 1px solid rgba(255, 255, 255, 0.03);
      flex-shrink: 0;
      transition: 0.3s;
    }

    .announcement-item:hover .icon-circle-small {
      background: rgba(255, 123, 156, 0.1);
      border-color: rgba(255, 123, 156, 0.2);
    }

    .announcement-item .info h2 {
      font-size: 1.05rem;
      font-weight: 500;
      color: #eef5ff;
      letter-spacing: 0.2px;
    }

    .announcement-item .info .date-tag {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.04);
      padding: 1px 12px;
      border-radius: 30px;
      margin-left: 10px;
    }

    .announcement-item .arrow {
      color: rgba(255, 255, 255, 0.15);
      font-size: 0.9rem;
      transition: 0.3s;
    }

    .announcement-item:hover .arrow {
      color: rgba(255, 255, 255, 0.4);
      transform: translateX(4px);
    }

    /* 底部 */
    .footer-note {
      margin-top: 2.8rem;
      text-align: center;
      color: rgba(255, 255, 255, 0.1);
      font-size: 0.7rem;
      letter-spacing: 0.8px;
      border-top: 1px solid rgba(255, 255, 255, 0.02);
      padding-top: 1.8rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .footer-note span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* 响应式 */
    @media (max-width: 600px) {
      .glass-card {
        padding: 2rem 1.2rem;
        border-radius: 2rem;
      }
      .brand h1 {
        font-size: 1.5rem;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      .announcement-item {
        padding: 0.8rem 1.2rem;
      }
      .announcement-item .info h2 {
        font-size: 0.95rem;
      }
      .announcement-item .info .date-tag {
        margin-left: 0;
        display: inline-block;
        margin-top: 2px;
      }
    }
  </style>
</head>
